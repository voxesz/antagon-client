<!doctype html>
<meta charset="utf-8" />
<script type="module">
  import { createCalls } from '../../ui/call.js';
  const clients = {};
  const log = [];
  for (const [id, name] of [
    ['aaaaaaaa-0000-4000-8000-000000000001', 'Host'],
    ['bbbbbbbb-0000-4000-8000-000000000002', 'Guest1'],
    ['cccccccc-0000-4000-8000-000000000003', 'Guest2'],
  ]) {
    const api = {
      call: {
        signal: async (to, callId, kind, payload) =>
          setTimeout(
            () =>
              clients[to].calls.receive({
                call_id: callId,
                sender: id,
                kind,
                payload: JSON.parse(JSON.stringify(payload)),
              }),
            5,
          ),
        iceServers: async () => [],
        microphone: async () => true,
        report: async () => {},
      },
    };
    clients[id] = {
      id,
      name,
      calls: createCalls({
        api,
        me: () => ({ id, name }),
        nameOf: () => null,
        toast: (m) => log.push(name + ': ' + m),
        onChange: () => {},
      }),
    };
  }
  window.clients = Object.values(clients);
  window.log = log;
</script>
